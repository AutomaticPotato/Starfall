# Starlights (aurora-server) on one machine with Docker. Run ./setup.sh from this folder the first time: it fills
# in .env, builds and starts everything, and has the app download and import Aurora Legacy and the 5etools data.
# Afterwards: `docker compose up -d` / `docker compose down`; the content links are on the app's Content page.
#
# ./data holds the books' content and your group's data (database, portraits, homebrew). It is never part of the
# repository; keep the site on your own network (or behind a password), not open to the internet.
# Backups, restores and updates: deploy/maintenance/ (see docs/maintenance.md).
#
# Images are named after the Compose project (COMPOSE_PROJECT_NAME in .env, which setup.sh makes unique per
# install), so two installs on one computer never build over each other's images. Without COMPOSE_PROJECT_NAME
# the project is the folder's name (deploy), so the images are deploy/backend and deploy/web; versions before
# this one used starlights/backend and starlights/web for every install.

x-db: &db
  ConnectionStrings__starlights-db: "Server=starlights-db;Database=starlights;User Id=sa;Password=${STARLIGHTS_SA_PASSWORD};TrustServerCertificate=True"

services:
  starlights-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Express
      MSSQL_MEMORY_LIMIT_MB: "2048"
      MSSQL_SA_PASSWORD: ${STARLIGHTS_SA_PASSWORD}
    volumes:
      - ./data/mssql:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  # the database migrations run once at every start, before the API
  starlights-migrate-elements:
    image: ${COMPOSE_PROJECT_NAME:-starlights}/backend
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
      args:
        # shown on the Content page; setup.sh and the README's update command set it
        STARLIGHTS_COMMIT: ${STARLIGHTS_COMMIT:-unknown}
    working_dir: /app/migrate-elements
    entrypoint: ["dotnet", "Modules.Elements.Data.EntityFramework.MigrationService.dll"]
    environment: *db
    depends_on:
      starlights-db:
        condition: service_healthy
    restart: "no"

  starlights-migrate-characters:
    image: ${COMPOSE_PROJECT_NAME:-starlights}/backend
    working_dir: /app/migrate-characters
    entrypoint: ["dotnet", "Modules.Characters.Data.EntityFramework.MigrationService.dll"]
    environment: *db
    depends_on:
      starlights-migrate-elements:
        condition: service_completed_successfully
    restart: "no"

  starlights-api:
    image: ${COMPOSE_PROJECT_NAME:-starlights}/backend
    init: true
    environment:
      <<: *db
      Elements__SampleContent: "false"
      Admin__Key: ${STARLIGHTS_ADMIN_KEY}
      Admin__MasterPassword: ${STARLIGHTS_MASTER_PASSWORD}
      # the app brings its own content in from the links on its Content page (Aurora Legacy, 5etools)
      Content__SelfManaged: "true"
      Content__Folder: /data/content
      Content__FiveEToolsSource: /data/content/5etools
      Content__LorePath: /data/lore
      Aurora__ContentPath: /data/content/aurora-elements
      FiveETools__Path: /data/content/5etools/data
      Aurora__HomebrewPath: /data/homebrew
    volumes:
      # the downloaded content and the Compendium of Lore built from it (written by the app)
      - ./data/content:/data/content
      - ./data/lore:/data/lore
      # your group's portraits, campaign pictures and homebrew (written by the app)
      - ./data/portraits:/data/portraits
      - ./data/homebrew:/data/homebrew
    depends_on:
      starlights-migrate-characters:
        condition: service_completed_successfully
    restart: unless-stopped

  starlights-web:
    image: ${COMPOSE_PROJECT_NAME:-starlights}/web
    build:
      context: ..
      dockerfile: deploy/frontend.Dockerfile
    init: true
    ports:
      - "${STARLIGHTS_PORT:-8093}:80"
    volumes:
      # the Compendium of Lore, built by the app from the 5etools data
      - ./data/lore:/srv/lore-data:ro
      # optional: background pictures (home-1.webp … home-5.webp, lore.webp, battle.webp)
      - ./data/art:/srv/art:ro
    depends_on:
      - starlights-api
    restart: unless-stopped
