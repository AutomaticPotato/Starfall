<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Starlights API</title>
    <!-- The Starlights API description (openapi.json, next to this page) in Scalar. Serve this folder
         (python3 -m http.server -d docs/api, or GitHub Pages); it reads no server and sends nothing anywhere. -->
  </head>
  <body>
    <div id="app"></div>
    <script src="https://cdn.jsdelivr.net/npm/@scalar/api-reference@1.67.0/dist/browser/standalone.js"></script>
    <script>
      Scalar.createApiReference("#app", {
        url: "./openapi.json",
        // each group runs its own server: no address to send requests to from here
        servers: [],
        hideClientButton: true,
        hideTestRequestButton: true,
        // no hosted extras (AI agent, MCP, the Scalar toolbar): the page only shows the description
        agent: { disabled: true },
        mcp: { disabled: true },
        showDeveloperTools: "never",
        defaultHttpClient: { targetKey: "python", clientKey: "requests" },
      });
    </script>
  </body>
</html>
